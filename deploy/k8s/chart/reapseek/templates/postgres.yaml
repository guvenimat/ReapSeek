apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels: {{- include "reapseek.labels" "postgres" | nindent 4 }}
spec:
  selector: {{- include "reapseek.selector" "postgres" | nindent 4 }}
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels: {{- include "reapseek.labels" "postgres" | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: {{- include "reapseek.selector" "postgres" | nindent 6 }}
  template:
    metadata:
      labels: {{- include "reapseek.labels" "postgres" | nindent 8 }}
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          env:
            - name: POSTGRES_DB
              value: reapseek
            - name: POSTGRES_USER
              value: reapseek
            {{- include "reapseek.secret" (dict "root" . "name" "POSTGRES_PASSWORD" "key" "POSTGRES_PASSWORD") | nindent 12 }}
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "reapseek", "-d", "reapseek"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "reapseek", "-d", "reapseek"]
            periodSeconds: 20
            failureThreshold: 6
          resources: {{- toYaml .Values.postgres.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.postgres.storage }}
