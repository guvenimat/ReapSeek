apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: reapseek
  labels: {{- include "reapseek.labels" "ingress" | nindent 4 }}
spec:
  rules:
    - host: {{ .Values.hosts.storefront }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: storefront
                port:
                  number: 3000
    - host: {{ .Values.hosts.backoffice }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backoffice
                port:
                  number: 80
    - host: {{ .Values.hosts.sandbox }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sandbox
                port:
                  number: 8080
    - host: {{ .Values.hosts.mailpit }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mailpit
                port:
                  number: 8025
    {{- if .Values.observability.enabled }}
    - host: {{ .Values.hosts.grafana }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: lgtm
                port:
                  number: 3000
    {{- end }}
