apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  labels: {{- include "reapseek.labels" "migrate" | nindent 4 }}
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "0"
spec:
  backoffLimit: 10
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels: {{- include "reapseek.labels" "migrate" | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: reapseek-api:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["--migrate", "--seed"]
          env:
            {{- include "reapseek.dbEnv" . | nindent 12 }}
          {{- include "reapseek.securityContext" . | nindent 10 }}
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: "1", memory: 512Mi }
