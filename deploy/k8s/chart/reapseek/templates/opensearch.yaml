apiVersion: v1
kind: Service
metadata:
  name: opensearch
  labels: {{- include "reapseek.labels" "opensearch" | nindent 4 }}
spec:
  selector: {{- include "reapseek.selector" "opensearch" | nindent 4 }}
  ports:
    - port: 9200
      targetPort: 9200
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: opensearch
  labels: {{- include "reapseek.labels" "opensearch" | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  serviceName: opensearch
  replicas: 1
  selector:
    matchLabels: {{- include "reapseek.selector" "opensearch" | nindent 6 }}
  template:
    metadata:
      labels: {{- include "reapseek.labels" "opensearch" | nindent 8 }}
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: opensearch
          image: {{ .Values.opensearch.image }}
          env:
            - name: discovery.type
              value: single-node
            - name: DISABLE_SECURITY_PLUGIN
              value: "true"
            - name: DISABLE_INSTALL_DEMO_CONFIG
              value: "true"
            - name: OPENSEARCH_JAVA_OPTS
              value: {{ .Values.opensearch.javaOpts | quote }}
          ports:
            - containerPort: 9200
          readinessProbe:
            httpGet:
              path: /_cluster/health?local=true
              port: 9200
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            tcpSocket:
              port: 9200
            initialDelaySeconds: 90
            periodSeconds: 30
          resources: {{- toYaml .Values.opensearch.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /usr/share/opensearch/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.opensearch.storage }}
