apiVersion: v1
kind: Service
metadata:
  name: mailpit
  labels: {{- include "reapseek.labels" "mailpit" | nindent 4 }}
spec:
  selector: {{- include "reapseek.selector" "mailpit" | nindent 4 }}
  ports:
    - name: smtp
      port: 1025
      targetPort: 1025
    - name: http
      port: 8025
      targetPort: 8025
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailpit
  labels: {{- include "reapseek.labels" "mailpit" | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: {{- include "reapseek.selector" "mailpit" | nindent 6 }}
  template:
    metadata:
      labels: {{- include "reapseek.labels" "mailpit" | nindent 8 }}
    spec:
      containers:
        - name: mailpit
          image: {{ .Values.mailpit.image }}
          ports:
            - containerPort: 1025
            - containerPort: 8025
          readinessProbe:
            httpGet:
              path: /livez
              port: 8025
          resources: {{- toYaml .Values.mailpit.resources | nindent 12 }}
