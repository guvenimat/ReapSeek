name: reapseek

x-postgres-connection: &postgres-connection Host=postgres;Database=reapseek;Username=reapseek;Password=${POSTGRES_PASSWORD:?Missing .env - run run-local.ps1 or copy .env.example to .env}
x-redis-connection: &redis-connection redis:6379,password=${REDIS_PASSWORD:?Missing .env - run run-local.ps1}
x-api-environment: &api-environment
  ConnectionStrings__Postgres: *postgres-connection
  ConnectionStrings__Redis: *redis-connection
  Auth__BootstrapEmail: ${ADMIN_EMAIL:?Missing .env - run run-local.ps1 or copy .env.example to .env}
  Auth__BootstrapPassword: ${ADMIN_PASSWORD:?Missing .env - run run-local.ps1 or copy .env.example to .env}
  Auth__SecureCookie: "false"
  Auth__AttemptsPerMinute: "20"
  ForwardedHeaders__TrustedNetworks: 172.16.0.0/12
  OpenSearch__Url: http://opensearch:9200
  Storefront__PublicUrl: http://localhost:3100
  Payments__Sandbox__ApiUrl: http://sandbox:8080
  Payments__Sandbox__SecretKey: ${SANDBOX_SECRET_KEY:?Missing .env - run run-local.ps1}
  Payments__Sandbox__WebhookSecret: ${SANDBOX_WEBHOOK_SECRET:?Missing .env - run run-local.ps1}
  Payments__WebhookUrl: http://api:8080/api/v1/payments/sandbox/webhook
  Shipping__WebhookUrl: http://api:8080/api/v1/shipping/sandbox/webhook
  ReapDeep__RecommendUrl: ${REAPDEEP_RECOMMEND_INTERNAL_URL:-http://host.docker.internal:8002}
  ReapDeep__PublicKey: ${REAPDEEP_PUBLIC_KEY:-}
  ReapDeep__RecommendationSecret: ${REAPDEEP_RECOMMENDATION_SECRET:-}
  ReapDeep__ApiUrl: ${REAPDEEP_API_URL:-http://host.docker.internal:8001}
  ReapDeep__ReadKey: ${REAPDEEP_READ_KEY:-}
  Recommendations__CacheSeconds: "30"

services:
  postgres:
    image: postgres:17
    container_name: reapseek-postgres
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_DB: reapseek
      POSTGRES_USER: reapseek
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Missing .env - run run-local.ps1 or copy .env.example to .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reapseek -d reapseek"]
      interval: 5s
      timeout: 5s
      retries: 10

  opensearch:
    image: opensearchproject/opensearch:3.8.0
    container_name: reapseek-opensearch
    ports:
      - "127.0.0.1:9200:9200"
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  redis:
    image: redis:8.8.4-alpine
    container_name: reapseek-redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Missing .env - run run-local.ps1}", "--save", "", "--appendonly", "no",
      "--maxmemory", "256mb", "--maxmemory-policy", "volatile-lru"]
    ports:
      - "127.0.0.1:6380:6379"
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?Missing .env - run run-local.ps1}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.27
    container_name: reapseek-mailpit
    ports:
      - "127.0.0.1:8025:8025"
    environment:
      MP_MAX_MESSAGES: 5000

  migrate:
    build:
      context: ../../src
      dockerfile: ReapSeek.Api/Dockerfile
    image: reapseek-api:local
    container_name: reapseek-migrate
    command: ["--migrate"]
    environment:
      ConnectionStrings__Postgres: *postgres-connection
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: reapseek-api:local
    container_name: reapseek-api
    ports:
      - "127.0.0.1:8100:8080"
    environment: *api-environment
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      migrate:
        condition: service_completed_successfully
      opensearch:
        condition: service_started
      redis:
        condition: service_started
      sandbox:
        condition: service_started
    restart: unless-stopped

  api-2:
    image: reapseek-api:local
    container_name: reapseek-api-2
    profiles: ["scale"]
    ports:
      - "127.0.0.1:8102:8080"
    environment: *api-environment
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      migrate:
        condition: service_completed_successfully
      opensearch:
        condition: service_started
      redis:
        condition: service_started
      sandbox:
        condition: service_started
    restart: unless-stopped

  worker:
    build:
      context: ../../src
      dockerfile: ReapSeek.Worker/Dockerfile
    image: reapseek-worker:local
    container_name: reapseek-worker
    environment:
      ConnectionStrings__Postgres: *postgres-connection
      ConnectionStrings__Redis: *redis-connection
      Smtp__Host: mailpit
      Smtp__Port: "1025"
      Storefront__PublicUrl: http://localhost:3100
      Outbox__PollMilliseconds: "500"
      ReapDeep__ApiUrl: ${REAPDEEP_API_URL:-http://host.docker.internal:8001}
      ReapDeep__CatalogKey: ${REAPDEEP_CATALOG_KEY:-}
      ReapDeep__ReadKey: ${REAPDEEP_READ_KEY:-}
      OpenSearch__Url: http://opensearch:9200
      ReapDeep__IngestUrl: ${REAPDEEP_INGEST_INTERNAL_URL:-http://host.docker.internal:8000}
      ReapDeep__PublicKey: ${REAPDEEP_PUBLIC_KEY:-}
      Orders__ExpiryCheckSeconds: "10"
      Payouts__CheckSeconds: "60"
      Carts__ReminderAfterSeconds: "20"
      Carts__ReminderCheckSeconds: "5"
      Payments__Sandbox__ApiUrl: http://sandbox:8080
      Payments__Sandbox__SecretKey: ${SANDBOX_SECRET_KEY:?Missing .env - run run-local.ps1}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
      opensearch:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  simulator:
    profiles: ["simulator"]
    build:
      context: ../../src
      dockerfile: ReapSeek.Simulator/Dockerfile
    image: reapseek-simulator:local
    container_name: reapseek-simulator
    command: ["live"]
    environment:
      ConnectionStrings__Postgres: *postgres-connection
      ReapDeep__IngestUrl: ${REAPDEEP_INGEST_INTERNAL_URL:-http://host.docker.internal:8000}
      ReapDeep__PublicKey: ${REAPDEEP_PUBLIC_KEY:-}
      Payments__Sandbox__ApiUrl: http://sandbox:8080
      Payments__Sandbox__SecretKey: ${SANDBOX_SECRET_KEY:?Missing .env - run run-local.ps1}
      Simulator__ApiUrl: http://api:8080
      Simulator__SandboxUrl: http://sandbox:8080
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      api:
        condition: service_started

  sandbox:
    build:
      context: ../../src
      dockerfile: ReapSeek.Sandbox/Dockerfile
    image: reapseek-sandbox:local
    container_name: reapseek-sandbox
    ports:
      - "127.0.0.1:8101:8080"
    environment:
      Sandbox__SecretKey: ${SANDBOX_SECRET_KEY:?Missing .env - run run-local.ps1}
      Sandbox__WebhookSecret: ${SANDBOX_WEBHOOK_SECRET:?Missing .env - run run-local.ps1}
      Sandbox__PublicUrl: http://localhost:8101
      Sandbox__ShipmentStepSeconds: "5"
      ConnectionStrings__Sandbox: Host=postgres;Port=5432;Database=sandbox;Username=reapseek;Password=${POSTGRES_PASSWORD:?Missing .env - run run-local.ps1}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  storefront:
    build:
      context: ../../storefront
    image: reapseek-storefront:local
    container_name: reapseek-storefront
    ports:
      - "127.0.0.1:3100:3000"
    environment:
      API_INTERNAL_URL: http://api:8080
      PUBLIC_URL: http://localhost:3100
      REAPDEEP_PUBLIC_KEY: ${REAPDEEP_PUBLIC_KEY:-}
      REAPDEEP_INGEST_URL: ${REAPDEEP_INGEST_URL:-http://localhost:8000}
      REAPDEEP_RECOMMEND_URL: ${REAPDEEP_RECOMMEND_URL:-http://localhost:8002}
    depends_on:
      - api
    restart: unless-stopped

  backoffice:
    build:
      context: ../../backoffice
    image: reapseek-backoffice:local
    container_name: reapseek-backoffice
    ports:
      - "127.0.0.1:3101:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres-data:
  opensearch-data:
